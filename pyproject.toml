[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnar-bridge"
version = "0.13.0"
description = "Puente entre el CLI de Claude Code, de Antigravity o de Codex en tu propio servidor y Ragnar: conexion WebSocket saliente, tus credenciales no salen de tu maquina."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["websockets>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
ragnar-bridge = "ragnar_bridge.cli:main"

[tool.setuptools]
packages = ["ragnar_bridge", "ragnar_bridge.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
